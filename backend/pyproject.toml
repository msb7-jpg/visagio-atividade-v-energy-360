[project]
name = "v-energy-backend"
version = "0.1.0"
description = "V-Energy Grid 360 FastAPI Backend & Embedded AI Text-to-SQL Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyjwt>=2.8.0",
    "pwdlib[argon2]>=0.2.0",
    "sqlparse>=0.5.0",
    "sse-starlette>=2.1.0",
    "langgraph>=1.2.0",
    "langchain-core>=1.6.0",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.7.2",
    "langchain-groq>=1.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pyright>=1.1.414",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "pylint>=3.3.0",
    "import-linter>=2.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


[tool.ruff]
preview = true
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle Error (estilo padrão)
    "F",    # Pyflakes (erros lógicos, variáveis não usadas)
    "I",    # isort (organização limpa de imports)
    "UP",   # pyupgrade (força sintaxe moderna do Python)
    "B",    # flake8-bugbear (previne bugs de lógica e anti-padrões comuns)
    "SIM",  # flake8-simplify (sugere simplificações de código)
    "complex-structure", # mccabe (Complexidade Ciclomática - a que você já queria)
    "PTH", # Suggests using pathlib instead of os.path (mais moderno e seguro)
    "TC",   # flake8-type-checking (previne importações desnecessárias de tipos)
    "N",    # pep8-naming (garante padrões estritos de nomenclatura)
    "C4",   # flake8-comprehensions (otimiza list/dict comprehensions)
    "FA",   # flake8-future-annotations (melhora performanceSIM de type hinting)
    "ISC",  # flake8-implicit-str-concat (evita bugs com strings implicitamente unidas)
    "PIE",  # flake8-pie (regras gerais de qualidade e refinamento de código)
    "PT",   # flake8-pytest-style (padroniza testes robustos e eficientes)
    "RSE",  # flake8-raise (evita parênteses desnecessários em exceções)
    "RET",  # flake8-return (força retornos lógicos mais limpos e legíveis)
    "SLF",  # flake8-self (bloqueia acessos indevidos a métodos privados de outras classes)
    "T20",  # flake8-print (proíbe `print` soltos no backend - exige logging correto)
    "PERF", # Perflint (regras focadas estritamente em performance backend)
    "FURB", # refurb (moderniza e refatora código antigo/ineficiente)
    "RUF",  # Regras nativas do próprio Ruff (erros específicos e profundos de Python)
    "ASYNC",# flake8-async (previne bugs clássicos em corotinas/código assíncrono)
    "S",    # flake8-bandit (análise de vulnerabilidades de segurança - ex: SQLi, Hardcoded secrets)
    "ambiguous-variable-name",
]

# Regras que você quer ignorar deliberadamente (evita alertas irritantes)
ignore = [
    "assert", # Permite usar `assert` (essencial para testes no pytest)
    "yield-in-context-manager-in-async-generator", # Yield dentro de context manager em gerador assíncrono (necessário para streaming SSE)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "sqlalchemy.orm.DeclarativeBase", "fastapi.Depends"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pylint>=3.3.0",
    "pyright>=1.1.414",
]

[tool.pyright]
include = ["app"]
typeCheckingMode = "standard"
useLibraryCodeForTypes = true
reportMissingTypeStubs = false # Evita alertas chatos de libs sem tipagem

# ==============================================================================
# Configuração do Pylint (Design, Tamanhos Limites e Nomenclatura)
# ==============================================================================
# Enquanto o Ruff foca em linting ultra-rápido de sintaxe e estilo PEP8, o Pylint
# atua como guardião da arquitetura e design: combate "God Files" (arquivos gigantes),
# métodos sobrecarregados, aninhamentos profundos e variáveis com nomes crípticos.

[tool.pylint.main]
py-version = "3.12"
# Ignora migrações geradas automaticamente para não poluir o relatório
ignore-paths = ["migrations/versions"]
# Execução paralela aproveitando todos os cores da CPU
jobs = 0

[tool.pylint.format]
# Previne arquivos monolíticos ("God Files").
# Se um arquivo passar de 300 linhas, ele deve ser dividido em módulos ou colaboradores especializados.
max-module-lines = 300
# Limite de caracteres por linha alinhado com a regra do Ruff
max-line-length = 120

[tool.pylint.design]
# Limite máximo de argumentos por função/método.
# Mais de 6 argumentos indica forte acoplamento; use um schema Pydantic ou dataclass para agrupar.
max-args = 6
max-positional-arguments = 6

# Limite máximo de variáveis locais em uma função/método.
# Funções com mais de 15 variáveis locais geralmente acumulam responsabilidades demais.
max-locals = 18

# Limite de retornos explícitos em uma função.
# Em validadores e despachantes com guard clauses, até 8 retornos garantem clareza sem quebrar.
max-returns = 8

# Limite de caminhos lógicos (if/elif/for/while).
# Mantém a complexidade baixa e facilita a criação de testes unitários.
max-branches = 12

# Limite máximo de instruções (statements) por método/função (~40 instruções correspondem a aprox. 50 linhas).
# Funções maiores que isso devem ser decompostas em sub-funções puras e especializadas.
max-statements = 45

# Limite de herança de classes.
max-parents = 7

# Limite de atributos de instância por classe.
max-attributes = 10

# Mínimo de métodos públicos: desativado (0) porque DTOs, schemas Pydantic e classes de configuração
# frequentemente não possuem métodos públicos e isso não é um defeito.
min-public-methods = 0

# Máximo de métodos públicos para evitar classes com responsabilidade excessiva.
max-public-methods = 20

# Limite de aninhamento de blocos de controle (ex: if dentro de for dentro de try).
# Evita a "pirâmide da morte" que prejudica a legibilidade do código.
max-nested-blocks = 4

[tool.pylint.basic]
# Nomes curtos explicitamente permitidos por serem convenções universais ou variáveis de descarte.
good-names = ["_", "id", "db", "app", "fn", "e"]

# Nomes proibidos de variáveis:
# Evita nomes preguiçosos ou genéricos em laços e desempacotamentos (ex: `for k, n in ...`).
# Adote nomes intencionais e que revelem o domínio de negócio (ex: `for metric_key, metric_value in ...`).
bad-names = [
    "k", "v", "n", "m", "i", "j", "l", "o",
    "foo", "bar", "baz", "temp", "tmp", "val", "item"
]

# Expressão regular para nomes de variáveis locais e de laços:
# Exige formato snake_case com no mínimo 2 caracteres (a menos que esteja em good-names).
variable-rgx = "^[a-z_][a-z0-9_]{1,30}$"

# Expressão regular para parâmetros de funções:
argument-rgx = "^[a-z_][a-z0-9_]{1,30}$"

# Expressão regular para atributos de classes:
attr-rgx = "^[a-z_][a-z0-9_]{1,30}$"

# Expressão regular para funções e métodos:
function-rgx = "^[a-z_][a-z0-9_]{2,40}$"
method-rgx = "^[a-z_][a-z0-9_]{2,40}$"

# Expressão regular para classes (PascalCase):
class-rgx = "^[A-Z_][a-zA-Z0-9]+$"

# Expressão regular para constantes globais (UPPER_CASE ou PascalCase para factories de sessão como AsyncSessionLocal):
const-rgx = "^(_?[A-Z][A-Z0-9_]*|[A-Z][a-zA-Z0-9]+|__[a-z0-9_]+__)$"

[tool.pylint.messages_control]
# Desativa regras redundantes (que o Ruff já cobre com muito mais velocidade) ou que não
# fazem sentido na arquitetura moderna FastAPI / Pydantic v2:
disable = [
    # Cobertos nativamente pelo Ruff / formatador:
    "line-too-long",
    "trailing-whitespace",
    "trailing-newlines",
    "missing-final-newline",
    # Docstrings são incentivadas mas não devem quebrar o build em todos os módulos internos:
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    # Pydantic e FastAPI geram classes/funções declarativas onde poucas funções públicas são normais:
    "too-few-public-methods",
    # Análise de tipagem e imports já é feita com precisão estrita pelo Pyright:
    "import-error",
    "no-name-in-module",
    # Comentários de TODO são permitidos durante o ciclo de desenvolvimento:
    "fixme",
    # Desativa checagem bruta de código duplicado aqui para não colidir com schemas similares:
    "duplicate-code",
    # Redefinição de escopo externo: comum e esperada no FastAPI (ex: lifespan(app: FastAPI)) e fixtures pytest:
    "redefined-outer-name",
    # Captura de exceção genérica é tratada em fallbacks de grafos/nós do agente:
    "broad-exception-caught",
]


[tool.pylint.similarities]
# Configuração de similaridade de código:
# Ignora comentários, docstrings e blocos de import ao analisar código repetido.
min-similarity-lines = 6
ignore-comments = true
ignore-docstrings = true
ignore-imports = true

# ==============================================================================
# Contratos Arquiteturais (Import-Linter)
# ==============================================================================
# O import-linter garante matematicamente as fronteiras de Clean Architecture:
# impede acoplamentos proibidos e vazamentos de camadas (ex: regras de transporte
# HTTP dentro de serviços de negócio ou agentes analíticos).

[tool.importlinter]
root_package = "app"
include_external_packages = true

# ------------------------------------------------------------------------------
# Contrato 1: Serviços são Pure Python
# Serviços contêm lógica de negócio, autenticação e regras de domínio puras.
# É ESTRITAMENTE PROIBIDO importar bibliotecas de transporte HTTP (FastAPI/Starlette).
# ------------------------------------------------------------------------------
[[tool.importlinter.contracts]]
name = "Serviços de negócio não importam frameworks HTTP (Pure Python Services)"
type = "forbidden"
source_modules = [
    "app.features.auth.service",
    "app.features.grid_quality.service",
    "app.features.grid_quality.rules",
]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sse_starlette",
]

# ------------------------------------------------------------------------------
# Contrato 2: Isolamento do Núcleo do Agente de IA
# O Agente LangGraph (nós, ferramentas, prompts, grafo) é um motor cognitivo autônomo.
# Não deve conhecer endpoints HTTP da API nem controladores de features web.
# ------------------------------------------------------------------------------
[[tool.importlinter.contracts]]
name = "Núcleo do Agente de IA é desacoplado de frameworks web e controladores de rotas"
type = "forbidden"
source_modules = [
    "app.agent",
]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sse_starlette",
    "app.api",
    "app.features",
]

# ------------------------------------------------------------------------------
# Contrato 3: Independência da Camada de Banco de Dados
# O módulo app.db (sessão, base ORM) é infraestrutura fundamental.
# Nunca deve importar módulos de regras de negócio, agentes analíticos ou rotas de API.
# ------------------------------------------------------------------------------
[[tool.importlinter.contracts]]
name = "Camada de infraestrutura de banco de dados não importa domínios, agentes ou rotas"
type = "forbidden"
source_modules = [
    "app.db",
]
forbidden_modules = [
    "fastapi",
    "starlette",
    "app.features",
    "app.agent",
    "app.api",
]

# ------------------------------------------------------------------------------
# Contrato 4: Exceções de Domínio são Pure Python
# Exceções de negócio (DomainException, NotFound, etc.) usam o módulo nativo http.HTTPStatus
# e não dependem do framework FastAPI.
# ------------------------------------------------------------------------------
[[tool.importlinter.contracts]]
name = "Exceções centrais de domínio não dependem de frameworks HTTP"
type = "forbidden"
source_modules = [
    "app.shared.exceptions",
]
forbidden_modules = [
    "fastapi",
    "starlette",
]


