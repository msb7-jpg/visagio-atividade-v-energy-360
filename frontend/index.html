<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>V-Energy Grid 360 | Plataforma de Inteligência & Operações</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura, para não piscar o tema errado. Padrão: escuro.
      try {
        var tema = localStorage.getItem('grid360.tema')
        document.documentElement.classList.toggle('dark', tema !== 'claro' && tema !== 'light')
      } catch (error) {
        document.documentElement.classList.add('dark')
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
