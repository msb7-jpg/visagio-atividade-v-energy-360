# Workflow do Lakehouse V-Energy Grid 360 (formato Databricks Asset Bundle).
# Notebooks fatia01_* são da Fatia 01 (Renan); fatia02_* são da Fatia 02 (Ryei Estevan).
#
# Ordem de cada fatia: Bronze -> Silver -> Gold -> testes de qualidade -> exportação.
# As duas exportações gravam o MESMO v_energy.db e por isso rodam em sequência:
#   1. fatia01_export_sqlite recria o arquivo do zero com as tabelas da Fatia 01;
#   2. Testes (Fatia 01) confere a Gold e esse arquivo;
#   3. fatia02_export_sqlite, só depois dos testes das duas fatias, acrescenta as
#      tabelas da Fatia 02 ao arquivo (nunca rodar em paralelo com o passo 1).
#
# Todos os notebooks ficam na mesma pasta do workspace (variável notebooks_dir).
# Para rodar em outro workspace: --var="notebooks_dir=/Workspace/<pasta>".
variables:
  notebooks_dir:
    description: Pasta do workspace com os notebooks das fatias
    default: /Workspace/Users/renandccavalcanti113@gmail.com/visagio-atividade-v-energy-360

resources:
  jobs:
    Job_Energy:
      name: Job Energy
      schedule:
        quartz_cron_expression: 0 0 4 1 * ?
        timezone_id: America/Recife
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      tasks:
        - task_key: Landing_to_Bronze
          notebook_task:
            notebook_path: ${var.notebooks_dir}/fatia01_bronze
            source: WORKSPACE
        - task_key: fatia02_bronze
          depends_on:
            - task_key: Landing_to_Bronze
          notebook_task:
            notebook_path: ${var.notebooks_dir}/fatia02_bronze
            source: WORKSPACE
        - task_key: Bronze_to_Silver
          depends_on:
            - task_key: Landing_to_Bronze
          notebook_task:
            notebook_path: ${var.notebooks_dir}/fatia01_silver
            source: WORKSPACE
        - task_key: fatia02_silver
          depends_on:
            - task_key: fatia02_bronze
            - task_key: Bronze_to_Silver
          notebook_task:
            notebook_path: ${var.notebooks_dir}/fatia02_silver
            source: WORKSPACE
        - task_key: Silver_to_Gold
          depends_on:
            - task_key: Bronze_to_Silver
          notebook_task:
            notebook_path: ${var.notebooks_dir}/fatia01_gold
            source: WORKSPACE
        - task_key: fatia02_gold
          depends_on:
            - task_key: fatia02_silver
          notebook_task:
            notebook_path: ${var.notebooks_dir}/fatia02_gold
            source: WORKSPACE
        - task_key: fatia01_export_sqlite
          depends_on:
            - task_key: Silver_to_Gold
          notebook_task:
            notebook_path: ${var.notebooks_dir}/fatia01_export_sqlite
            source: WORKSPACE
        - task_key: Testes
          depends_on:
            - task_key: fatia01_export_sqlite
          notebook_task:
            notebook_path: ${var.notebooks_dir}/fatia01_testes_qualidade
            source: WORKSPACE
        - task_key: fatia02_testes_qualidade
          depends_on:
            - task_key: fatia02_gold
          notebook_task:
            notebook_path: ${var.notebooks_dir}/fatia02_testes_qualidade
            source: WORKSPACE
        - task_key: fatia02_export_sqlite
          depends_on:
            - task_key: Testes
            - task_key: fatia02_testes_qualidade
          notebook_task:
            notebook_path: ${var.notebooks_dir}/fatia02_export_sqlite
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
